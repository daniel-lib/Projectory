<main class="settings-content" th:fragment="settings-content">
	<aside th:replace="user/user-layouts :: side-menu"></aside>
	<div class="settings-content-inner">
		<header class="settings-header">
			<h1>Settings</h1>
			<p>Manage your account details and appearance.</p>
		</header>

		<div th:if="${settingsMessage}" class="alert alert-success" role="status" th:text="${settingsMessage}"></div>
		<div th:if="${settingsError}" class="alert alert-danger" role="alert" th:text="${settingsError}"></div>

		<section class="settings-panel">
			<h2>Personal information</h2>
			<p class="settings-help-text">Confirm your current password before saving account changes.</p>
			<form th:action="@{/user/settings}" method="post" class="settings-form">
				<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

				<div class="settings-form-grid">
					<div class="mb-3">
						<label for="settings-first-name" class="form-label">First name</label>
						<input id="settings-first-name" name="firstName" class="form-control" type="text"
							maxlength="50" required autocomplete="given-name"
							th:value="${currentUserDetail.firstName}">
					</div>
					<div class="mb-3">
						<label for="settings-last-name" class="form-label">Last name</label>
						<input id="settings-last-name" name="lastName" class="form-control" type="text"
							maxlength="50" required autocomplete="family-name"
							th:value="${currentUserDetail.lastName}">
					</div>
					<div class="mb-3 settings-form-wide">
						<label for="settings-username" class="form-label">Username</label>
						<input id="settings-username" name="username" class="form-control" type="text"
							minlength="3" maxlength="30" pattern="[A-Za-z0-9._-]+"
							title="Use 3-30 letters, numbers, periods, underscores, or hyphens."
							required autocomplete="username" th:value="${currentUserDetail.username}">
					</div>
				</div>

				<hr>
				<h3>Change password</h3>
				<p class="settings-help-text">Leave both new password fields blank to keep your current password.</p>
				<div class="settings-form-grid">
					<div class="mb-3 settings-form-wide">
						<label for="settings-current-password" class="form-label">Current password</label>
						<input id="settings-current-password" name="currentPassword" class="form-control"
							type="password" required autocomplete="current-password">
					</div>
					<div class="mb-3">
						<label for="settings-new-password" class="form-label">New password</label>
						<input id="settings-new-password" name="newPassword" class="form-control"
							type="password" minlength="8" autocomplete="new-password">
					</div>
					<div class="mb-3">
						<label for="settings-confirm-password" class="form-label">Confirm new password</label>
						<input id="settings-confirm-password" name="confirmNewPassword" class="form-control"
							type="password" minlength="8" autocomplete="new-password">
					</div>
				</div>
				<button type="submit" class="btn btn-success">Save changes</button>
			</form>
		</section>

		<section class="settings-panel settings-appearance">
			<div>
				<h2>Appearance</h2>
				<p class="settings-help-text mb-0">Choose your preferred color theme.</p>
			</div>
			<div class="d-flex align-items-center gap-2">
				<span>Theme</span>
				<span th:replace="mainLayouts :: theme-switch"></span>
			</div>
		</section>
	</div>
</main>
