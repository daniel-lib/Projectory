<!DOCTYPE html>
<html xmlns="https://www.thymeleaf.org">

<!--todo display modal start-->
<div th:fragment="todo-list-modal-content" id="todo-list-modal-content" class="modal-inner-content">
	<span class="d-flex justify-content-	 mt-3">
		<span class="dashboard-card-img-top mx-2 mt-1 fa-solid fa-list" alt="to-do icon"></span>
		<h5 class="card-title dashboard-card-title">Notes &amp; personal todo tasks</h5>
	</span>
	<hr/>

	<div th:replace="user/todo/todoLayouts :: add-new-collection-form"></div>

	<!-- Collection list — target for HTMX swaps -->
	<div id="todo-collection-list-container" hx-get="/todo-list-collection/fragment/list"
		hx-trigger="todoCollectionsChanged from:body" hx-swap="innerHTML">
		<div th:replace="user/todo/todoLayouts :: todo-collection-list"></div>
	</div>

	<dialog id="delete-todo-collection-confirmation" class="todo-collection-confirmation"
		aria-labelledby="delete-todo-collection-title">
		<h2 id="delete-todo-collection-title">Delete collection?</h2>
		<p>This will permanently delete the collection and all of its todo items.</p>
		<div class="todo-collection-confirmation-actions">
			<button type="button" class="collection-action-btn collection-action-delete"
				onclick="confirmDeleteTodoCollection()">Delete collection</button>
			<button type="button" class="collection-action-btn collection-action-cancel"
				onclick="document.getElementById('delete-todo-collection-confirmation').close()">Cancel</button>
		</div>
	</dialog>
</div>
<!--todo display modal end-->


<!-- ─────────────────────────────────────────────────────────────
     FRAGMENT: todo-collection-list
     Used as the HTMX swap target for the whole collection list.
     ───────────────────────────────────────────────────────────── -->
<div th:fragment="todo-collection-list">
	<div th:object="${TodoCollections}" class="">
		<div class="todo-collection my-3 pt-1" th:each="collection : ${TodoCollections}"
			th:id="'todo-collection-box-' + ${collection.todoCollectionId}">
			<div class="collection-date d-flex flex-wrap justify-content-between">
				<span class="info-tag-dark align-self-start">Created on: <span
						th:text="${collection.creationDate}"></span></span>
				<div class="todo-collection-title-content" th:attr="data-collection-id=${collection.todoCollectionId}">
					<span class="todo-collection-name align-self-start ps-3 pe-3"
						th:text="${collection.collectionTitle}"></span>
				</div>
				<span class="info-tag-dark align-self-start">Modified on: <span
						th:text="${collection.modificationDate}"></span></span>
			</div>

			<div th:replace="user/todo/todoLayouts :: displayItems"></div>

			<div class="collection-bottom-btns">
				<button type="button" class="collection-action-btn collection-action-edit edit-todo-collection-btn"
					th:attr="data-collection-id=${collection.todoCollectionId}"
					title="Edit collection name">
					<span class="fa-solid fa-pen-to-square" aria-hidden="true"></span>
					Edit name
				</button>
				<button type="button" class="collection-action-btn collection-action-delete delete-todo-collection-btn"
					th:attr="data-collection-id=${collection.todoCollectionId}, data-collection-title=${collection.collectionTitle}"
					title="Delete collection">
					<span class="fa-solid fa-trash-can" aria-hidden="true"></span>
					Delete
				</button>
			</div>
		</div>
	</div>
</div>


<!--todo list card started-->
<div th:fragment="todo-list-dashboard-card"
	class="card user-dashboard-cards todo-list-card card user-dashboard-cards custom-scrollbar-style"
	style="width: 18rem;" onclick="displayViewingModal(0)" data-aos="zoom-in">
	<div class="card-header d-flex">
		<span class="dashboard-card-img-top mx-2 mt-1 fa-solid fa-list" alt="to-do icon"></span>
		<h5 class="card-title dashboard-card-title">Notes &amp; todo tasks</h5>
	</div>
	<div class="card-body p-1">

		<p class="card-text fw-lighter mb-0 item-count item-count-check" th:text="${itemCount}"></p>

		<div th:object="${TodoCollections}" class="dashboard-card-content-container-inner m-0 custom-scrollbar-style-3">
			<!--displaying collection on card-->
			<div class="dashboard-card-content-items dashboard-card-collection-items p-1 m-1 mb-3"
				th:each="collection : ${TodoCollections}">
				<div class="dashboard-card-content-items-inner">
					<div class="collection-date d-flex flex-wrap justify-content-between">
						<span class="todo-collection-name align-self-start ps-3 pe-3"><span
								th:text="${collection.collectionTitle}"></span></span>
						<span class="info-tag-dark align-self-start">Last modified: <span
								th:text="${collection.modificationDate}"></span></span>
					</div>

					<div th:each="item : ${collection.todoListItems}">
						<div class="list-items mb-1 p-1">
							<span th:text="${item.title}" class=""></span>
						</div>
					</div>
				</div>

				<div role="button" class="card-open-collection-btn"
					th:onclick="scrollToSpecificCollection('todo-collection-box-[[${collection.todoCollectionId}]]')">
					<span role="button">open collection</span>
				</div>
			</div>
		</div>

		<div class="todo-card-btns mt-2">
			<input type="button" class="minimalist-btn minimalist-btn-lighter minimalist-btn-lighter2 btn-sm add-todo-collection-btn"
				onClick="showAddTodoCollectionForm('card')" value="Add New Collection">
		</div>

	</div>
</div>


<!--display todo list items started-->
<div th:fragment="displayItems" class="item-display-table p-2"
	th:id="|todo-display-items-${collection.todoCollectionId}|">
	<div class="d-flex">
		<button class="minimalist-btn minimalist-btn-blk-bg btn-sm mt-3" onClick="addContributersForm()">Add
			contributers</button>
	</div>

	<div th:replace="user/todo/todoLayouts :: add-todo-item-form"></div>
	<p class="card-text fw-lighter mb-0 item-count item-count-check" th:text="${itemCount}"></p>

	<form hx-post="/todo/fragment/delete-selected"
		  hx-target="#todo-collection-list-container"
		  hx-swap="innerHTML"
		  method="post">
		<button type="submit" class="btn btn-danger btn-sm mt-3 float-end delete-selected-btn" value="Delete Selected"
			th:id="'delete-selected-btn-' + ${collection.todoCollectionId}" disabled>
			Delete <span class="badge text-bg-warning number-of-items-badge"
				th:id="'number-of-items-badge-' + ${collection.todoCollectionId}" disabled>0</span> Items
		</button>
		<br /><br />
		<!-- Item list — target for per-collection HTMX swaps -->
		<div class="d-block todo-list-display-box custom-scrollbar-style-3"
			 th:id="'todo-items-' + ${collection.todoCollectionId}">
			<div class="todo-item-column-header">
				<span>Mark as done</span>
				<span aria-hidden="true"></span>
			</div>
			<div th:each="item : ${collection.todoListItems}">
				<div th:replace="user/todo/todoLayouts :: todo-item"></div>
			</div>
		</div>

	</form>

</div>

<div th:fragment="todo-item" class="list-items"
	th:classappend="${item.completed} ? ' todo-item-completed' : ''">
	<span class="float-start todo-done-checkbox item-control-buttons item-control-right-border mt-2">
		<input type="checkbox" name="done" value="true"
			th:checked="${item.completed}"
			th:attr="hx-post=@{/todo/fragment/toggle-done(itemId=${item.todoItemId})}, hx-target='closest .list-items'"
			hx-trigger="change" hx-swap="outerHTML"
			class="form-check-input mark-todo-task-done red-checkbox green-checkbox"
			title="Mark as done" aria-label="Mark as done">
	</span>

	<div class="d-flex justify-content-between p-2">
		<div class="todo-item-content" style="display: inline;" th:attr="data-todo-item-id=${item.todoItemId}">
			<span class="todo-item-title" th:text="${item.title}"></span>
			<button type="button" class="edit-item-btn fa-solid fa-pen-to-square"
				title="Edit Item" aria-label="Edit todo item">
				<span class="visually-hidden">Edit todo item</span>
			</button>
		</div>

		<div class="item-deletion-controls d-flex" style="display: inline;">
			<span role="button"
				th:hx-post="'/todo/fragment/delete-item?itemId=' + ${item.todoItemId} + '&collectionId=' + ${collection.todoCollectionId}"
				th:hx-target="'#todo-display-items-' + ${collection.todoCollectionId}"
				hx-swap="outerHTML"
				th:class="'link-white-color float-end delete-single-item-link-' + ${collection.todoCollectionId}">
				<span
					th:class="'badge text-bg-danger delete-single-item-btn delete-single-item-btn-' + ${collection.todoCollectionId} + ' fa-solid fa-trash-can'"
					title="Delete Item"> </span>
			</span>

			<span class="delete-item-checkbox item-control-buttons item-control-left-border">
				<input type="checkbox"
					th:onclick="'readyDeleteButton(' + ${collection.todoCollectionId} + ')'"
					name="selectedForRemoval" th:value="${item.todoItemId}"
					th:class="'form-check-input checkbox-for-deletion-' + ${collection.todoCollectionId} + ' red-checkbox'"
					title="Select item for deletion">
			</span>
		</div>
	</div>
</div>

<div class="add-contributers-form" id="add-contributers-form" th:fragment="add-contributers-form">
	<form>

	</form>
</div>


<!--add new collection form-->
<div th:fragment="add-new-collection-form" class="form-container-subtle mt-2 overflow-hidden"
	id="add-new-collection-form">
	<div class="p-3">
		<h6>Add New Collection</h6>
		<div class="d-flex">
			<input type="text" class="form-control add-todo-collection-input mt-3 col-md-10"
				placeholder="What should we call your collection"
				id="collection-name-input"
				name="title"
				autofocus maxlength="40"
				style="width: 70%;">
			<!-- HTMX: add collection and refresh the list -->
			<button hx-post="/todo-list-collection/add-collection"
					hx-include="#collection-name-input"
					hx-swap="none"
					hx-on::after-request="if (event.detail.xhr.responseText === '1') this.previousElementSibling.value = ''"
					class="btn btn-primary-golden btn-sm add-todo-collection-btn mt-3 ms-2">Add Collection</button>
		</div>
	</div>
</div>


<!--add todo item form-->
<div th:fragment="add-todo-item-form"
	class="form-container-subtle mt-4 add-todo-item-form overflow-hidden">
	<div class="p-2">
		<form class="subtle-form-input-container d-flex"
			th:attr="hx-post=@{/todo/fragment/add-item(collectionId=${collection.todoCollectionId})}, hx-target=|#todo-display-items-${collection.todoCollectionId}|, data-collection-id=${collection.todoCollectionId}"
			hx-swap="outerHTML"
			hx-on::after-request="if (event.detail.successful) { const input = document.getElementById('col-' + this.dataset.collectionId + '-todo-title-input'); if (input) { input.value = ''; input.focus(); } }">
			<input type="text" class="subtle-form-input p-2"
				placeholder="What would you like to add?"
				name="title"
				th:id="'col-' + ${collection.todoCollectionId} + '-todo-title-input'"
				autofocus required>
			<button type="submit" class="subtle-form-btn d-inline p-2">
				<span class="fa-solid fa-circle-plus"></span>
				Add Item</button>
		</form>
	</div>
</div>



</html>
