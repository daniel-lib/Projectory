<main class="profile-content" th:fragment="profile-content">
	<aside th:replace="user/user-layouts :: side-menu"></aside>
	<section class="profile-content-inner">
		<section class="profile-hero">
			<div th:replace="user/profile/profile-layouts :: profile-banner"></div>
			<div class="profile-hero-content" th:replace="user/profile/profile-layouts :: profile-top-user-info"></div>
			<div class="profile-hero-mark" aria-hidden="true">P</div>
		</section>

		<div th:if="${profileUserExists}" class="profile-overview">
			<section class="profile-stat-grid" aria-label="Profile overview">
				<div class="profile-stat-card">
					<span class="profile-stat-icon">⌂</span>
					<span class="profile-stat-value" th:text="${userProjectCount}">0</span>
					<span class="profile-stat-label">Projects involved</span>
				</div>
				<div class="profile-stat-card">
					<span class="profile-stat-icon">✦</span>
					<span class="profile-stat-value" th:text="${userCreatedProjectCount}">0</span>
					<span class="profile-stat-label">Projects started</span>
				</div>
				<div class="profile-stat-card">
					<span class="profile-stat-icon">◎</span>
					<span class="profile-stat-value" th:text="${userConnectsCount}">0</span>
					<span class="profile-stat-label">Connections</span>
				</div>
				<div th:if="${ownAccount}" class="profile-stat-card">
					<span class="profile-stat-icon">✓</span>
					<span class="profile-stat-value" th:text="${completedTaskCount + ' / ' + assignedTaskCount}">0 / 0</span>
					<span class="profile-stat-label">Assigned tasks completed</span>
				</div>
			</section>

			<div class="profile-main-grid">
				<section class="profile-panel profile-history">
					<div class="profile-panel-heading">
						<div>
							<p class="profile-eyebrow">WORKSPACE HISTORY</p>
							<h2>Recent projects</h2>
						</div>
						<a th:if="${ownAccount}" class="profile-text-link" th:href="@{/user/dashboard}">Open dashboard</a>
					</div>
					<div th:if="${#lists.isEmpty(recentUserProjects)}" class="profile-empty-state">
						No project activity to show yet. Create or join a project to get started.
					</div>
					<div th:each="project : ${recentUserProjects}" class="profile-project-entry">
						<span class="profile-project-marker" aria-hidden="true"></span>
						<div class="profile-project-copy">
							<div class="profile-project-meta">
								<span th:text="${project.creationDate}">Date</span>
								<span class="profile-project-status" th:text="${project.status}">Status</span>
							</div>
							<h3 th:text="${project.title}">Project title</h3>
							<p th:text="${project.description}">Project summary</p>
						</div>
					</div>
				</section>

				<div th:replace="user/profile/profile-layouts :: connections-preview"></div>
			</div>
		</div>
	</section>
</main>
