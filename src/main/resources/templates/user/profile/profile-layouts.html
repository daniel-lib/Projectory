<section class="profile-banner" th:fragment="profile-banner">
	<div class="profile-picture" th:if="${profileUser != null}">
		<img th:if="${profileUser.profilePicture != null and !#strings.isEmpty(profileUser.profilePicture) and #strings.length(profileUser.profilePicture) > 1}"
			th:src="${profileUser.profilePicture}" alt="Profile picture" />
		<span th:if="${profileUser.profilePicture == null or #strings.isEmpty(profileUser.profilePicture) or #strings.length(profileUser.profilePicture) <= 1}"
			class="profile-pic-btn prof-text-only profile-picture-placeholder">
			<span class="fa-regular fa-user" aria-label="Profile"></span>
		</span>
	</div>
</section>

<div class="profile-top-user-info mt-3" th:fragment="profile-top-user-info">
	<div class="d-flex justify-content-between flex-wrap" th:if="${profileUser != null}">
		<span>
			<span class="d-flex">
				<h3><span th:text="${profileUser.firstName}"></span> <span th:text="${profileUser.lastName}"></span></h3>
				<span class="online-status-indicator ms-2 p-1 align-self-center"
					th:classappend="${profileUser.loginIndicator}"></span>
			</span>
			<span id="profile-header-username">@<span th:text="${profileUser.username}"></span></span>
		</span>

		<div th:if="${!ownAccount}"
			th:attr="id=|connection-action-buttons-${viewedUserId}|, hx-get=@{/user/fragment/connection-status(user=${viewedUserId})}"
			hx-trigger="load, profileConnectionsChanged from:body" hx-swap="outerHTML">
			<span class="htmx-indicator">Loading connection status...</span>
		</div>
	</div>
	<div th:if="${profileUser == null}" class="alert alert-secondary">This user profile could not be found.</div>
</div>

<div th:fragment="user-project-list" class="project-list-loop">
	<div th:each="project : ${userProjectList}" class="user-project-list-items mb-1 p-2 m-3">
		<span class="d-flex justify-content-between">
			<span style="font-weight: 300;">Created: <span th:text="${project.creationDate}"></span></span>
			<span>Created By:
				<a th:href="@{/user/{username}(username=${project.projectOwnerUsername})}"
					class="no-text-decoration cadetblue cadetblue-hover">
					@<span th:text="${project.projectOwnerUsername}"></span>
				</a>
			</span>
		</span>
		<h5 th:text="${project.title}"></h5>
		<span style="font-weight: 300;" th:text="${project.description}"></span>
	</div>
</div>

<div th:fragment="connections-panel">
	<div th:replace="user/profile/profile-layouts :: connections-preview"></div>
</div>

<section th:fragment="connections-preview" id="connections-panel" class="profile-panel profile-network"
	th:attr="hx-get=${ownAccount} ? @{/user/fragment/connections(username=${profileUsername})} : null"
	hx-trigger="profileConnectionsChanged from:body" hx-swap="outerHTML">
	<div class="profile-panel-heading">
		<div>
			<p class="profile-eyebrow">YOUR NETWORK</p>
			<h2>Connections <span class="profile-count" th:text="${userConnectsCount}"></span></h2>
		</div>
		<a th:if="${ownAccount}" class="profile-text-link" th:href="@{/user/connections}">View all</a>
	</div>
	<div th:if="${ownAccount}">
		<h3 class="profile-subheading">Recent requests</h3>
		<div th:replace="user/profile/profile-layouts :: receivedConnectionRequest(${recentReceivedConnections})"></div>
		<p th:if="${#lists.isEmpty(recentReceivedConnections)}" class="profile-empty-state">
			You're all caught up. New connection requests will appear here.
		</p>
		<a class="profile-more-link" th:href="@{/user/connections}">Manage your connections <span aria-hidden="true">→</span></a>
	</div>
	<p th:unless="${ownAccount}" class="profile-empty-state">Connections on Projectory</p>
</section>

<div th:fragment="approvedConnections" class="connections-list-loop custom-scrollbar-style-2">
	<div th:each="connect : ${userConnectionsList}" class="user-project-list-items mb-1 p-2 m-3">
		<h6>
			<a th:href="@{/user/{username}(username=${connect.connectedUserUsername})}" class="no-text-decoration">
				<span th:if="${connect.profilePicture == null or #strings.isEmpty(connect.profilePicture) or #strings.length(connect.profilePicture) == 1}"
					class="profile-pic-btn prof-text-only connection-avatar-initial"
					th:classappend="${' prof-' + (connect.profilePicture == null ? 'default' : connect.profilePicture)}"
					>
					<span th:if="${!#strings.isEmpty(connect.profilePicture)}"
						th:text="${#strings.toUpperCase(connect.profilePicture)}"></span>
					<span th:if="${#strings.isEmpty(connect.profilePicture) and !#strings.isEmpty(connect.connectedUserFirstName)}"
						th:text="${#strings.toUpperCase(#strings.substring(connect.connectedUserFirstName, 0, 1))}"></span>
					<span th:if="${#strings.isEmpty(connect.profilePicture) and #strings.isEmpty(connect.connectedUserFirstName)}"
						class="fa-regular fa-user" aria-label="Profile"></span>
				</span>
				<span th:if="${connect.profilePicture != null and !#strings.isEmpty(connect.profilePicture) and #strings.length(connect.profilePicture) > 1}"
					class="profile-pic-btn">
					<img th:src="${connect.profilePicture}" class="fs-11" alt="Profile picture">
				</span>
				<span th:text="${connect.connectedUserFirstName + ' ' + connect.connectedUserLastName}"></span>
			</a>
		</h6>
		<span class="fs-10 ms-4" style="font-weight: 300;">
			@<span th:text="${connect.connectedUserUsername}"></span>
		</span>
		<button th:if="${ownAccount}" type="button" class="align-self-start minimalist-btn minimalist-btn-theme-controlled float-end"
			th:attr="data-unfriend-url=@{/user/connection/remove-by-conn-id/{connectionId}(connectionId=${connect.connectionId})}"
			onclick="openUnfriendConfirmation(this)">
			<span class="fa-solid fa-times pe-1"></span><span>Unfriend</span>
		</button>
	</div>
</div>

<div th:fragment="receivedConnectionRequest(requests)" class="connections-list-loop custom-scrollbar-style-2">
	<div th:each="receivedReq : ${requests}"
		th:if="${receivedReq.connectionStatus == 'pending'}"
		class="user-project-list-items mb-1 p-2 m-3">
		<h6>
			<a th:href="@{/user/{username}(username=${receivedReq.connectedUserUsername})}" class="no-text-decoration">
				<span th:if="${receivedReq.profilePicture == null or #strings.isEmpty(receivedReq.profilePicture) or #strings.length(receivedReq.profilePicture) == 1}"
					class="profile-pic-btn prof-text-only"
					th:classappend="${' connection-avatar-initial prof-' + (receivedReq.profilePicture == null ? 'default' : receivedReq.profilePicture)}"
					>
					<span th:if="${!#strings.isEmpty(receivedReq.profilePicture)}"
						th:text="${#strings.toUpperCase(receivedReq.profilePicture)}"></span>
					<span th:if="${#strings.isEmpty(receivedReq.profilePicture) and !#strings.isEmpty(receivedReq.connectedUserFirstName)}"
						th:text="${#strings.toUpperCase(#strings.substring(receivedReq.connectedUserFirstName, 0, 1))}"></span>
					<span th:if="${#strings.isEmpty(receivedReq.profilePicture) and #strings.isEmpty(receivedReq.connectedUserFirstName)}"
						class="fa-regular fa-user" aria-label="Profile"></span>
				</span>
				<span th:if="${receivedReq.profilePicture != null and !#strings.isEmpty(receivedReq.profilePicture) and #strings.length(receivedReq.profilePicture) > 1}"
					class="profile-pic-btn">
					<img th:src="${receivedReq.profilePicture}" class="fs-11" alt="Profile picture">
				</span>
				<span th:text="${receivedReq.connectedUserFirstName + ' ' + receivedReq.connectedUserLastName}"></span>
			</a>
		</h6>
		<span class="fs-10 ms-4" style="font-weight: 300;">
			@<span th:text="${receivedReq.connectedUserUsername}"></span>
		</span>
		<button class="minimalist-btn minimalist-btn-theme-controlled-lighter float-end"
			th:attr="hx-post=@{/user/connection/request/reject/{connectionId}(connectionId=${receivedReq.connectionId})}"
			hx-target="#connections-panel" hx-swap="none">
			<span class="fa-solid fa-times"></span> Reject request
		</button>
		<button class="minimalist-btn minimalist-btn-theme-controlled float-end"
			th:attr="hx-post=@{/user/connection/request/accept/{connectionId}(connectionId=${receivedReq.connectionId})}"
			hx-target="#connections-panel" hx-swap="none">
			<span class="fa-solid fa-check"></span> Accept request
		</button>
	</div>
</div>

<div th:fragment="sentConnectionRequest" class="connections-list-loop custom-scrollbar-style-2">
	<div th:each="sentRequest : ${sentConnections}"
		th:if="${sentRequest.connectionStatus == 'pending'}"
		class="user-project-list-items mb-1 p-2 m-3">
		<h6>
			<a th:href="@{/user/{username}(username=${sentRequest.connectedUserUsername})}" class="no-text-decoration">
				<span th:if="${sentRequest.profilePicture == null or #strings.isEmpty(sentRequest.profilePicture) or #strings.length(sentRequest.profilePicture) == 1}"
					class="profile-pic-btn prof-text-only"
					th:classappend="${' connection-avatar-initial prof-' + (sentRequest.profilePicture == null ? 'default' : sentRequest.profilePicture)}"
					>
					<span th:if="${!#strings.isEmpty(sentRequest.profilePicture)}"
						th:text="${#strings.toUpperCase(sentRequest.profilePicture)}"></span>
					<span th:if="${#strings.isEmpty(sentRequest.profilePicture) and !#strings.isEmpty(sentRequest.connectedUserFirstName)}"
						th:text="${#strings.toUpperCase(#strings.substring(sentRequest.connectedUserFirstName, 0, 1))}"></span>
					<span th:if="${#strings.isEmpty(sentRequest.profilePicture) and #strings.isEmpty(sentRequest.connectedUserFirstName)}"
						class="fa-regular fa-user" aria-label="Profile"></span>
				</span>
				<span th:if="${sentRequest.profilePicture != null and !#strings.isEmpty(sentRequest.profilePicture) and #strings.length(sentRequest.profilePicture) > 1}"
					class="profile-pic-btn">
					<img th:src="${sentRequest.profilePicture}" class="fs-11" alt="Profile picture">
				</span>
				<span th:text="${sentRequest.connectedUserFirstName + ' ' + sentRequest.connectedUserLastName}"></span>
			</a>
		</h6>
		<span class="fs-10 ms-4" style="font-weight: 300;">
			@<span th:text="${sentRequest.connectedUserUsername}"></span>
		</span>
		<button class="minimalist-btn minimalist-btn-theme-controlled float-end"
			th:attr="hx-post=@{/user/connection/request/remove-username/{username}(username=${sentRequest.connectedUserUsername})}"
			hx-target="#connections-panel" hx-swap="none">
			<span class="fa-solid fa-times"></span> Cancel request
		</button>
	</div>
</div>
